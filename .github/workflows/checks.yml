name: Checks

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run repository contract tests
        run: python -m unittest discover -s tests -v
